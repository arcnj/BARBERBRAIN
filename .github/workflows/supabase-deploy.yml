name: Supabase (deploy)

# Aplica as migrations e publica as edge functions no projeto Supabase de produção.
# Roda quando algo em supabase/ chega ao main, ou manualmente (aba Actions → Run workflow).
# Precisa de 3 segredos no repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   senha do banco definida ao criar o projeto
#   SUPABASE_PROJECT_ID    "Reference ID" do projeto (Project Settings → General)

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations e edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Verificar segredos
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Segredos do Supabase não configurados; deploy ignorado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.122.0

      - name: Vincular projeto
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Aplicar migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push

      - name: Publicar edge functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
