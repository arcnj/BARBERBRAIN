name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # valores fictícios: o build só embute as variáveis, não conecta ao Supabase
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder

  banco:
    name: Migrations e seed num Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Sobe só o necessário (Postgres, Auth, REST, Storage) e aplica todas as migrations + seed.sql
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,realtime,mailpit,edge-runtime,postgres-meta

      - name: Conferir dados do seed
        run: |
          n=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.profiles")
          echo "profiles criados pelo seed: $n"
          test "$n" = "5"

      - run: supabase stop --no-backup
        if: always()
