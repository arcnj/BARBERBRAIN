name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # valores fictícios: o build só embute as variáveis, não conecta ao Supabase
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder

  banco:
    name: Migrations e seed num Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Sobe só o necessário (Postgres, Auth, REST, Storage) e aplica todas as migrations + seed.sql
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,realtime,mailpit,edge-runtime,postgres-meta

      - name: Conferir dados do seed
        run: |
          n=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.profiles")
          echo "profiles criados pelo seed: $n"
          test "$n" = "5"

      - name: Testes do banco (pgTAP)
        run: supabase test db

      # Os tipos do front precisam refletir o banco. Se este passo falhar, baixe o artefato
      # "supabase-types" e substitua src/integrations/supabase/types.ts (ou rode npm run db:types).
      - name: Gerar tipos do banco
        run: supabase gen types typescript --local > /tmp/types.ts

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-types
          path: /tmp/types.ts

      - name: Conferir tipos versionados
        run: |
          if ! diff -q src/integrations/supabase/types.ts /tmp/types.ts > /dev/null; then
            echo "::error::src/integrations/supabase/types.ts desatualizado. Baixe o artefato supabase-types ou rode npm run db:types."
            diff -u src/integrations/supabase/types.ts /tmp/types.ts | head -200 || true
            # cópia compactada no log, para quem não consegue baixar o artefato
            echo "----- TYPES_GZ_BASE64_BEGIN -----"
            gzip -9 -c /tmp/types.ts | base64 -w 120
            echo "----- TYPES_GZ_BASE64_END -----"
            exit 1
          fi

      - run: supabase stop --no-backup
        if: always()
